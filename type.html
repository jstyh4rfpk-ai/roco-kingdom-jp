<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>属性相性・弱点一覧 | ロコキングダム速報</title>

<meta name="description"
content="Roco Kingdom（洛克王国：世界）の属性相性・弱点・耐性を日本語で確認できる攻略ページです。">

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  color:#17324d;
  line-height:1.7;
  background:#f1f8fd;
}

header{
  padding:28px 16px;
  text-align:center;
  color:white;
  background:linear-gradient(135deg,#50b7f0,#79d4ff);
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:6px 0 0;
  font-size:13px;
}

.back{
  display:block;
  padding:14px 18px;
  background:white;
  border-bottom:1px solid #dceaf4;
  color:#1677d2;
  text-decoration:none;
  font-weight:900;
}

main{
  width:min(950px,calc(100% - 24px));
  margin:20px auto 50px;
}

.card{
  margin-bottom:18px;
  padding:20px;
  background:white;
  border:1px solid #dceaf3;
  border-radius:19px;
  box-shadow:0 5px 20px rgba(30,90,130,.08);
}

.card h2{
  margin:0 0 13px;
  font-size:22px;
}

.card p{
  color:#647e92;
  font-size:13px;
}

/* =========================
   説明
========================= */

.guide{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-top:15px;
}

.guide-item{
  padding:12px;
  text-align:center;
  border-radius:13px;
  background:#f2f8fc;
}

.guide-item strong{
  display:block;
  font-size:18px;
}

.guide-item span{
  color:#72899b;
  font-size:11px;
}

/* =========================
   属性カード
========================= */

.type-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
}

.type-card{
  position:relative;
  overflow:hidden;
  min-height:230px;
  padding:17px 14px 17px 18px;

  background:#f8fbfd;
  border:1px solid #d6e5ef;
  border-radius:17px;
}

.type-card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:7px;
  height:100%;
  background:var(--type-color);
}

.type-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:15px;
  font-size:23px;
  font-weight:900;
}

.type-icon{
  font-size:27px;
}

.label{
  margin-top:12px;
  margin-bottom:6px;
  color:#748b9e;
  font-size:12px;
  font-weight:900;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.tag{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:5px 9px;
  border:1px solid #d2e1eb;
  border-radius:999px;
  background:white;
  color:#27445c;
  font-size:12px;
  font-weight:800;
}

.none{
  color:#91a1ae;
  font-size:12px;
}

/* 色 */

.normal{--type-color:#999}
.grass{--type-color:#63ad54}
.fire{--type-color:#ea6654}
.water{--type-color:#579ce0}
.light{--type-color:#e5b32b}
.ground{--type-color:#a98252}
.ice{--type-color:#65bdd3}
.dragon{--type-color:#7552b5}
.electric{--type-color:#dfb727}
.poison{--type-color:#985ca9}
.bug{--type-color:#82a938}
.fighting{--type-color:#c46d3b}
.wing{--type-color:#78a7d1}
.cute{--type-color:#e77aa6}
.ghost{--type-color:#756294}
.dark{--type-color:#62536e}
.machine{--type-color:#6e8290}
.illusion{--type-color:#a767b5}

/* =========================
   相性表
========================= */

.table-help{
  margin:8px 0 14px;
  padding:11px 13px;
  border-radius:12px;
  background:#eef8ff;
  color:#4e7089;
  font-size:12px;
}

.table-scroll{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  border:1px solid #d9e6ee;
  border-radius:14px;
}

table{
  border-collapse:collapse;
  min-width:1160px;
  width:100%;
  background:white;
  font-size:11px;
}

th,
td{
  min-width:55px;
  height:49px;
  padding:5px;
  text-align:center;
  border-right:1px solid #e3ebf1;
  border-bottom:1px solid #e3ebf1;
}

th{
  background:#f0f7fb;
  font-weight:900;
}

thead th{
  position:sticky;
  top:0;
  z-index:2;
}

.row-head{
  position:sticky;
  left:0;
  z-index:1;
  min-width:75px;
  background:#f0f7fb;
  font-weight:900;
}

thead .row-head{
  z-index:3;
}

.super{
  background:#ffeaea;
  color:#c33d3d;
  font-weight:900;
}

.resist{
  background:#eaf7ee;
  color:#317547;
  font-weight:900;
}

.normal-cell{
  color:#a0adb7;
}

.legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:13px;
}

.legend span{
  padding:5px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.legend-super{
  background:#ffeaea;
  color:#c33d3d;
}

.legend-normal{
  background:#f2f5f7;
  color:#728493;
}

.legend-resist{
  background:#eaf7ee;
  color:#317547;
}

/* =========================
   注意
========================= */

.notice{
  padding:16px;
  border-radius:14px;
  background:#fff9e7;
  border:1px solid #efdb96;
  color:#66582b;
  font-size:12px;
}

/* =========================
   PC
========================= */

@media(min-width:750px){

  .type-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

/* =========================
   スマホ
========================= */

@media(max-width:400px){

  .type-card{
    min-height:220px;
    padding-left:16px;
  }

  .type-title{
    font-size:20px;
  }

  .tag{
    padding:4px 7px;
    font-size:11px;
  }

}

</style>
</head>

<body>

<header>
  <h1>🔥 属性相性</h1>
  <p>ロコキングダム速報 攻略ガイド</p>
</header>

<a class="back" href="index.html">
  ← ロコキングダム速報へ戻る
</a>

<main>

<section class="card">

<h2>🧭 属性相性について</h2>

<p>
各属性の弱点・耐性を一覧で確認できます。
下部には全属性を比較できる相性表も掲載しています。
</p>

<div class="guide">

<div class="guide-item">
<strong>×2</strong>
<span>弱点</span>
</div>

<div class="guide-item">
<strong>×0.5</strong>
<span>耐性</span>
</div>

</div>

</section>


<section class="card">

<h2>🧭 属性一覧</h2>

<div class="type-grid" id="typeGrid"></div>

</section>


<section class="card">

<h2>⚔️ 全属性相性表</h2>

<div class="table-help">
← 横にスクロールできます<br>
縦＝攻撃属性 ／ 横＝防御属性
</div>

<div class="table-scroll">

<table id="matchupTable"></table>

</div>

<div class="legend">

<span class="legend-super">
×2 弱点
</span>

<span class="legend-normal">
×1 通常
</span>

<span class="legend-resist">
×0.5 耐性
</span>

</div>

</section>


<div class="notice">

<strong>📌 属性相性について</strong>

<br><br>

中国版「洛克王国：世界」の属性情報をもとに、
日本ユーザー向けに整理しています。

<br><br>

日本版で属性名・仕様が変更された場合は、
正式情報に合わせて更新します。

</div>

</main>


<script>

/* ==========================================
   属性
========================================== */

const types = [

{
 id:"normal",
 name:"普通",
 icon:"⚪"
},

{
 id:"grass",
 name:"草",
 icon:"🌿"
},

{
 id:"fire",
 name:"火",
 icon:"🔥"
},

{
 id:"water",
 name:"水",
 icon:"💧"
},

{
 id:"light",
 name:"光",
 icon:"✨"
},

{
 id:"ground",
 name:"地",
 icon:"⛰️"
},

{
 id:"ice",
 name:"氷",
 icon:"❄️"
},

{
 id:"dragon",
 name:"龍",
 icon:"🐉"
},

{
 id:"electric",
 name:"電気",
 icon:"⚡"
},

{
 id:"poison",
 name:"毒",
 icon:"☠️"
},

{
 id:"bug",
 name:"虫",
 icon:"🐛"
},

{
 id:"fighting",
 name:"武",
 icon:"👊"
},

{
 id:"wing",
 name:"翼",
 icon:"🪽"
},

{
 id:"cute",
 name:"萌",
 icon:"💕"
},

{
 id:"ghost",
 name:"幽",
 icon:"👻"
},

{
 id:"dark",
 name:"悪",
 icon:"😈"
},

{
 id:"machine",
 name:"機械",
 icon:"⚙️"
},

{
 id:"illusion",
 name:"幻",
 icon:"🔮"
}

];


/*
==================================================
 防御側から見た相性

 weakness
   → その属性から ×2

 resistance
   → その属性から ×0.5
==================================================
*/

const matchup = {

normal:{
 weakness:[],
 resistance:[]
},

grass:{
 weakness:[
   "fire",
   "ice",
   "poison",
   "bug",
   "wing"
 ],
 resistance:[
   "water",
   "light",
   "ground",
   "electric"
 ]
},

fire:{
 weakness:[
   "water",
   "ground"
 ],
 resistance:[
   "grass",
   "fire",
   "ice",
   "bug"
 ]
},

water:{
 weakness:[
   "grass",
   "electric"
 ],
 resistance:[
   "fire",
   "water",
   "ice"
 ]
},

light:{
 weakness:[
   "grass",
   "ghost"
 ],
 resistance:[
   "dark",
   "illusion"
 ]
},

ground:{
 weakness:[
   "grass",
   "water",
   "ice"
 ],
 resistance:[
   "poison",
   "electric"
 ]
},

ice:{
 weakness:[
   "fire",
   "fighting",
   "machine"
 ],
 resistance:[
   "ice"
 ]
},

dragon:{
 weakness:[
   "ice",
   "dragon",
   "cute"
 ],
 resistance:[
   "grass",
   "fire",
   "water",
   "electric"
 ]
},

electric:{
 weakness:[
   "ground"
 ],
 resistance:[
   "electric",
   "wing",
   "machine"
 ]
},

poison:{
 weakness:[
   "ground",
   "illusion"
 ],
 resistance:[
   "grass",
   "poison",
   "bug",
   "fighting",
   "cute"
 ]
},

bug:{
 weakness:[
   "fire",
   "wing"
 ],
 resistance:[
   "grass",
   "ground",
   "fighting"
 ]
},

fighting:{
 weakness:[
   "wing",
   "illusion",
   "cute"
 ],
 resistance:[
   "bug",
   "dark"
 ]
},

wing:{
 weakness:[
   "electric",
   "ice"
 ],
 resistance:[
   "grass",
   "bug",
   "fighting"
 ]
},

cute:{
 weakness:[
   "poison",
   "machine"
 ],
 resistance:[
   "fighting",
   "bug",
   "dark"
 ]
},

ghost:{
 weakness:[
   "light",
   "ghost",
   "dark"
 ],
 resistance:[
   "poison",
   "bug"
 ]
},

dark:{
 weakness:[
   "fighting",
   "bug",
   "cute",
   "light"
 ],
 resistance:[
   "ghost",
   "dark"
 ]
},

machine:{
 weakness:[
   "fire",
   "ground",
   "fighting"
 ],
 resistance:[
   "normal",
   "grass",
   "ice",
   "wing",
   "cute",
   "machine"
 ]
},

illusion:{
 weakness:[
   "dark",
   "bug",
   "ghost"
 ],
 resistance:[
   "fighting",
   "illusion"
 ]
}

};


/* ==========================================
   属性を取得
========================================== */

function getType(id){

 return types.find(
   type => type.id === id
 );

}


/* ==========================================
   タグ
========================================== */

function createTags(list){

 if(!list || list.length === 0){

   return `
     <span class="none">
       なし
     </span>
   `;

 }

 return list.map(id=>{

   const type=getType(id);

   if(!type){
     return "";
   }

   return `
     <span class="tag">
       ${type.icon}
       ${type.name}
     </span>
   `;

 }).join("");

}


/* ==========================================
   属性カード
========================================== */

function renderCards(){

 const grid=
   document.getElementById("typeGrid");

 grid.innerHTML=
 types.map(type=>{

   const data=
     matchup[type.id];

   return `

   <div class="type-card ${type.id}">

     <div class="type-title">

       <span class="type-icon">
         ${type.icon}
       </span>

       <span>
         ${type.name}
       </span>

     </div>


     <div class="label">
       ⚠️ 弱点
     </div>

     <div class="tags">
       ${createTags(data.weakness)}
     </div>


     <div class="label">
       🛡️ 耐性
     </div>

     <div class="tags">
       ${createTags(data.resistance)}
     </div>

   </div>

   `;

 }).join("");

}


/* ==========================================
   攻撃倍率
========================================== */

function getMultiplier(
 attacker,
 defender
){

 const data=
   matchup[defender];

 if(
   data.weakness.includes(attacker)
 ){
   return 2;
 }

 if(
   data.resistance.includes(attacker)
 ){
   return 0.5;
 }

 return 1;

}


/* ==========================================
   表セル
========================================== */

function multiplierCell(value){

 if(value === 2){

   return `
     <td class="super">
       ×2
     </td>
   `;

 }

 if(value === 0.5){

   return `
     <td class="resist">
       ×0.5
     </td>
   `;

 }

 return `
   <td class="normal-cell">
     ×1
   </td>
 `;

}


/* ==========================================
   相性表
========================================== */

function renderTable(){

 const table=
   document.getElementById(
     "matchupTable"
   );


 /* ヘッダー */

 let html=`

 <thead>

 <tr>

 <th class="row-head">
 攻＼防
 </th>

 ${types.map(type=>`

 <th>
 ${type.icon}<br>
 ${type.name}
 </th>

 `).join("")}

 </tr>

 </thead>

 <tbody>

 `;


 /* 攻撃側 */

 types.forEach(attacker=>{

   html+=`

   <tr>

   <th class="row-head">
     ${attacker.icon}
     ${attacker.name}
   </th>

   `;


   /* 防御側 */

   types.forEach(defender=>{

     const value=
       getMultiplier(
         attacker.id,
         defender.id
       );

     html+=
       multiplierCell(value);

   });


   html+=`
   </tr>
   `;

 });


 html+=`
 </tbody>
 `;


 table.innerHTML=html;

}


/* ==========================================
   起動
========================================== */

renderCards();
renderTable();

</script>

</body>
</html>
