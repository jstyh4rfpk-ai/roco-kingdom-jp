<style>

/* ========================================

.card{

/* ========================================
   キャラクター
======================================== */

.character-image{

.character-image img{

.no{

.name{

.cn{

.type{

.type-normal{background:#929292}

.type-fire{background:#ed6253}
.type-water{background:#479fe8}
.type-light{background:#e4ad25}
.type-ground{background:#aa8151}
.type-ice{background:#68c6dc}
.type-dragon{background:#7654b5}
.type-electric{background:#e4b91f}
.type-poison{background:#985ca9}
.type-bug{background:#82a938}
.type-fighting{background:#c46d3b}
.type-wing{background:#78a7d1}
.type-cute{background:#e77aa6}
.type-ghost{background:#756294}

/* ========================================

======================================== */

.data-status{

</a>

<nav class="detail-nav" aria-label="詳細ページ内メニュー">
  <a href="#statsSection">📊 ステータス</a>
  <a href="#matchupSection">⚔️ 属性相性</a>
  <a href="#traitSection">✨ 特性</a>
  <a href="#skillsSection">📖 技</a>
  <a href="#evolutionSection">🌱 進化</a>
  <a href="#obtainSection">🎁 入手方法</a>
</nav>

<main id="content">
  <div class="card">
    読み込み中...
  </div>
</main>

<script src="characters.js"></script>

<script>

/* ==========================================
   URLからキャラクター取得
========================================== */

const params = new URLSearchParams(window.location.search);

const keyParam = params.get("key");
const idParam = Number(params.get("id"));

let character = null;

if(keyParam){

  character = characters.find(
    c => c.key === keyParam
  );

}

if(!character && idParam){

  character =
    characters.find(
      c =>
        c.id === idParam &&
        c.form === "main"
    )
    ||
    characters.find(
      c => c.id === idParam
    );

}

const content = document.getElementById("content");


/* ==========================================
   共通
========================================== */

function displayValue(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){
    return "確認中";
  }

  return value;
}


/* ==========================================
   技
========================================== */

function skillHTML(skill){

  const level =
    skill.level !== undefined &&
    skill.level !== null
    ? `Lv.${skill.level}`
    : "";

  const power =
    skill.power === null ||
    skill.power === undefined
    ? ""
    : `<span class="tag">威力 ${skill.power}</span>`;

  const cost =
    skill.cost === null ||
    skill.cost === undefined
    ? ""
    : `<span class="tag">消費 ${skill.cost}</span>`;

  return `

    <div class="skill">

      <div class="skill-top">

        <span class="skill-name">
          ${skill.name || "名称確認中"}
        </span>

        <span class="skill-level">
          ${level}
        </span>

      </div>

      ${
        skill.chineseName
        ?
        `
          <div class="skill-original">
            中国名：${skill.chineseName}
          </div>
        `
        :
        ""
      }

      <div class="skill-tags">

        ${
          skill.type
          ?
          `<span class="tag">${skill.type}</span>`
          :
          ""
        }

        ${
          skill.category
          ?
          `<span class="tag">${skill.category}</span>`
          :
          ""
        }

        ${power}
        ${cost}

      </div>

      <div class="skill-effect">
        ${skill.description || "効果確認中"}
      </div>

    </div>

  `;
}


function skillGroup(title,icon,list){

  if(!list || list.length === 0){

    return `

      <div class="skill-group">

        <div class="skill-group-title">
          ${icon} ${title}
        </div>

        <p class="empty">
          現在データ整理中です。
        </p>

      </div>

    `;
  }

  return `

    <div class="skill-group">

      <div class="skill-group-title">

        ${icon} ${title}

        <span class="skill-count">
          （${list.length}）
        </span>

      </div>

      ${list.map(skillHTML).join("")}

    </div>

  `;
}


/* ==========================================
   形態一覧
========================================== */

function getRelatedForms(currentCharacter){

  const keys =
    Array.isArray(currentCharacter.forms)
    ? currentCharacter.forms
    : [];

  const found = [];

  keys.forEach(key => {

    const form = characters.find(
      c => c.key === key
    );

    if(
      form &&
      !found.some(item => item.key === form.key)
    ){
      found.push(form);
    }

  });

  /*
   formsへの登録漏れがあっても、
   同じ図鑑番号なら自動的に拾う
  */

  characters.forEach(form => {

    if(
      form.dexNo === currentCharacter.dexNo &&
      !found.some(item => item.key === form.key)
    ){
      found.push(form);
    }

  });

  return found;
}


function createFormsHTML(currentCharacter){

  const forms = getRelatedForms(currentCharacter);

  if(forms.length <= 1){
    return "";
  }

  const buttons = forms.map(form => {

    const active =
      form.key === currentCharacter.key;

    const boss =
      form.isBossForm === true;

    const label =
      form.formName ||
      form.name;

    return `

      <a
        class="form-button ${active ? "active" : ""} ${boss ? "boss" : ""}"
        href="character.html?key=${encodeURIComponent(form.key)}"
      >

        ${boss ? "👑 " : ""}
        ${label}

      </a>

    `;

  }).join("");

  return `

    <section class="card forms-card">

      <h2>
        🔄 形態切り替え
      </h2>

      <p class="forms-description">
        このキャラクターには複数の形態があります。
        表示したい形態を選択してください。
      </p>

      <div class="form-switcher">
        ${buttons}
      </div>

    </section>

  `;
}


/* ==========================================
   属性相性
========================================== */

function matchupMultiplierText(multiplier){

  if(multiplier === 0){
    return "無効";
  }

  if(multiplier === 0.25){
    return "×0.25";
  }

  if(multiplier === 0.5){
    return "×0.5";
  }

  if(multiplier === 1){
    return "×1";
  }

  if(multiplier === 2){
    return "×2";
  }

  if(multiplier === 4){
    return "×4";
  }

  return `×${multiplier}`;
}


function matchupItemHTML(item){

  const data = typeData[item.type];

  return `

    <span class="matchup-tag">

      ${data?.icon || ""}

      ${data?.name || item.type}

      ${matchupMultiplierText(item.multiplier)}

    </span>

  `;
}


function matchupListHTML(list){

  if(!list || list.length === 0){

    return `
      <span class="empty">
        なし
      </span>
    `;
  }

  return list.map(matchupItemHTML).join("");
}


function createMatchupHTML(currentCharacter){

  if(typeof getCharacterTypeMatchups !== "function"){

    return `

      <div class="matchup-loading">

        <div class="matchup-loading-title">
          🔎 属性相性データ確認中
        </div>

        <div class="matchup-loading-text">
          現在、中国版の正確な属性相性を確認しています。
        </div>

      </div>

    `;
  }

  const result =
    getCharacterTypeMatchups(currentCharacter);

  const confirmedCount =
    result.weaknesses.length +
    result.resistances.length +
    result.neutral.length +
    result.immunities.length;

  /*
   characters.js の typeMatchupData が
   まだ空の場合
  */

  if(confirmedCount === 0){

    return `

      <div class="matchup-loading">

        <div class="matchup-loading-title">
          🔎 属性相性データ確認中
        </div>

        <div class="matchup-loading-text">
          中国版「洛克王国：世界」の正確な属性相性を確認後、
          弱点・耐性・無効を掲載します。
        </div>

      </div>

    `;
  }

  const partialNotice =
    result.unknown.length > 0
    ?
    `

      <div class="matchup-partial">
        ⚠️ 一部の属性相性は現在確認中です。
        確認済みのデータのみ表示しています。
      </div>

    `
    :
    "";

  const immuneHTML =
    result.immunities.length > 0
    ?
    `

      <div class="matchup immune">

        <div class="matchup-title">
          🚫 無効
        </div>

        ${matchupListHTML(result.immunities)}

      </div>

    `
    :
    "";

  return `

    ${partialNotice}

    <div class="matchup-grid">

      <div class="matchup weak">

        <div class="matchup-title">
          ⚠️ 弱点
        </div>

        ${matchupListHTML(result.weaknesses)}

      </div>

      <div class="matchup resist">

        <div class="matchup-title">
          🛡️ 耐性
        </div>

        ${matchupListHTML(result.resistances)}

      ${immuneHTML}

  `;
}


/* ==========================================
   進化情報から図鑑番号を取得
========================================== */

function getEvolutionDexNo(text){

  if(!text){
    return null;
  }

  /*
   「003 喵呜」
   「Lv.20 → 016 铃兰羊」
   の両方に対応

   Lv.20 の 20 を誤認しないよう、
   3桁の図鑑番号を優先する
  */

  const threeDigit =
    String(text).match(/(?:^|[^\d])(\d{3})(?=[^\d]|$)/g);

  if(threeDigit && threeDigit.length){

    const last =
      threeDigit[threeDigit.length - 1]
        .match(/\d{3}/);

    if(last){
      return last[0];
    }
  }

  /*
   念のため1～2桁表記にも対応
  */

  const arrowMatch =
    String(text).match(
      /(?:→|>|＞)\s*(\d{1,3})/
    );

  if(arrowMatch){

    return String(
      Number(arrowMatch[1])
    ).padStart(3,"0");

  }

  const beginningMatch =
    String(text).match(
      /^\s*(\d{1,3})(?:\s|$)/
    );

  if(beginningMatch){

    return String(
      Number(beginningMatch[1])
    ).padStart(3,"0");

  }

  return null;
}


/* ==========================================
   進化用の代表形態
========================================== */

function getMainEvolutionCharacter(dexNo){

  if(!dexNo){
    return null;
  }

  const normalized =
    String(dexNo).padStart(3,"0");

  const sameDex =
    characters.filter(
      c => c.dexNo === normalized
    );

  if(sameDex.length === 0){
    return null;
  }

  const main =
    sameDex.find(
      c => c.form === "main"
    );

  if(main){
    return main;
  }

  /*
   NO.011のようにmainが存在しない場合、
   非首領・非季節形態を代表にする
  */

  const normal =
    sameDex.find(
      c =>
        c.form !== "season" &&
        c.form !== "boss" &&
        c.isBossForm !== true
    );

  return normal || sameDex[0];
}


/* ==========================================
   進化系統の検索対象になる形態か
========================================== */

function isEvolutionRepresentative(currentCharacter){

  if(!currentCharacter){
    return false;
  }

  const representative =
    getMainEvolutionCharacter(
      currentCharacter.dexNo
    );

  return (
    representative &&
    representative.key === currentCharacter.key
  );
}


/* ==========================================
   evolution配列を実キャラクターへ変換
========================================== */

function getRawEvolutionTargets(currentCharacter){

  if(
    !currentCharacter ||
    !Array.isArray(currentCharacter.evolution) ||
    currentCharacter.evolution.length === 0
  ){
    return [];
  }

  const result = [];

  currentCharacter.evolution.forEach(text => {

    const dexNo =
      getEvolutionDexNo(text);

    const target =
      getMainEvolutionCharacter(dexNo);

    if(
      target &&
      target.dexNo !== currentCharacter.dexNo &&
      !result.some(
        item => item.character.dexNo === target.dexNo
      )
    ){

      result.push({
        character:target,
        text:text
      });

    }

  });

  return result;
}


/* ==========================================
   ある進化先へ到達できるか
========================================== */

function canReachEvolution(
  source,
  targetDex,
  visited = new Set()
){

  if(!source){
    return false;
  }

  if(visited.has(source.dexNo)){
    return false;
  }

  const nextVisited =
    new Set(visited);

  nextVisited.add(source.dexNo);

  const targets =
    getRawEvolutionTargets(source);

  for(const item of targets){

    if(item.character.dexNo === targetDex){
      return true;
    }

    if(
      canReachEvolution(
        item.character,
        targetDex,
        nextVisited
      )
    ){
      return true;
    }

  }

  return false;
}


/* ==========================================
   直接の進化先だけ取得

   例：
   002 → 003
   002 → 004
   003 → 004

   と登録されていても

   002 → 003 → 004

   と表示する
========================================== */

function getEvolutionTargets(currentCharacter){

  const rawTargets =
    getRawEvolutionTargets(currentCharacter);

  if(rawTargets.length <= 1){
    return rawTargets;
  }

  return rawTargets.filter(candidate => {

    const candidateDex =
      candidate.character.dexNo;

    const reachableThroughOther =
      rawTargets.some(other => {

        if(
          other.character.dexNo ===
          candidateDex
        ){
          return false;
        }

        return canReachEvolution(
          other.character,
          candidateDex
        );

      });

    return !reachableThroughOther;

  });
}


/* ==========================================
   直接の進化前を逆引き
========================================== */

function getPreEvolutionCharacters(currentCharacter){

  if(!currentCharacter){
    return [];
  }

  const currentDex =
    currentCharacter.dexNo;

  const result = [];

  characters.forEach(source => {

    if(
      !isEvolutionRepresentative(source)
    ){
      return;
    }

    const targets =
      getEvolutionTargets(source);

    targets.forEach(targetItem => {

      if(
        targetItem.character.dexNo === currentDex &&
        source.dexNo !== currentDex
      ){

        const representative =
          getMainEvolutionCharacter(
            source.dexNo
          );

        if(
          representative &&
          !result.some(
            item =>
              item.character.key ===
              representative.key
          )
        ){

          result.push({
            character:representative,
            text:targetItem.text
          });

        }

      }

    });

  });

  return result;
}


/* ==========================================
   進化系統の始点まで戻る
========================================== */

function findEvolutionRoots(
  currentCharacter,
  visited = new Set()
){

  if(!currentCharacter){
    return [];
  }

  if(visited.has(currentCharacter.key)){
    return [currentCharacter];
  }

  const nextVisited =
    new Set(visited);

  nextVisited.add(currentCharacter.key);

  const previous =
    getPreEvolutionCharacters(
      currentCharacter
    );

  if(previous.length === 0){
    return [currentCharacter];
  }

  let roots = [];

  previous.forEach(item => {

    roots.push(
      ...findEvolutionRoots(
        item.character,
        nextVisited
      )
    );

  });

  return roots.filter(
    (item,index,array) =>
      array.findIndex(
        other => other.key === item.key
      ) === index
  );
}


/* ==========================================
   進化系統全体を段階化
========================================== */

function buildEvolutionStages(roots){

  const stages = [];

  let currentStage =
    roots.map(character => ({
      character:character,
      text:""
    }));

  const globallyVisited =
    new Set();

  while(
    currentStage.length > 0 &&
    stages.length < 20
  ){

    const uniqueStage = [];

    currentStage.forEach(item => {

      if(
        !uniqueStage.some(
          existing =>
            existing.character.key ===
            item.character.key
        )
      ){
        uniqueStage.push(item);
      }

    });

    stages.push(uniqueStage);

    const nextStage = [];

    uniqueStage.forEach(item => {

      const source =
        item.character;

      globallyVisited.add(
        source.key
      );

      const targets =
        getEvolutionTargets(source);

      targets.forEach(targetItem => {

        if(
          globallyVisited.has(
            targetItem.character.key
          )
        ){
          return;
        }

        const existing =
          nextStage.find(
            next =>
              next.character.key ===
              targetItem.character.key
          );

        if(!existing){
          nextStage.push(targetItem);
        }

      });

    });

    currentStage = nextStage;

  }

  return stages;
}


/* ==========================================
   進化条件の表示文字を整える
========================================== */

function getEvolutionNote(text){

  if(!text){
    return "";
  }

  const value =
    String(text).trim();

  /*
   「003 喵呜」など、
   番号＋名前だけなら条件ではないので非表示
  */

  if(
    /^\d{1,3}\s+.+$/.test(value)
  ){
    return "";
  }

  /*
   「Lv.20 → 016 铃兰羊」
   ↓
   「Lv.20」
  */

  if(value.includes("→")){

    const condition =
      value.split("→")[0].trim();

    return condition;
  }

  return value;
}

/* ==========================================
   進化系統表示
========================================== */

function createEvolutionHTML(currentCharacter){

  /*
   季節・首領・variantを開いていても
   同じ図鑑番号の代表形態を基準にする
  */

  const baseCharacter =
    getMainEvolutionCharacter(
      currentCharacter.dexNo
    )
    ||
    currentCharacter;

  const roots =
    findEvolutionRoots(
      baseCharacter
    );

  const stages =
    buildEvolutionStages(
      roots.length
      ? roots
      : [baseCharacter]
    );

  if(!stages || stages.length === 0){

    return `
      <div class="empty">
        進化情報は現在確認中です。
      </div>
    `;
  }

  /*
   前後の進化がなく、
   evolution自体も空なら
   「進化なし」として表示
  */

  const hasEvolution =
    stages.length > 1 ||
    getPreEvolutionCharacters(baseCharacter).length > 0 ||
    getEvolutionTargets(baseCharacter).length > 0;

  if(!hasEvolution){

    return `

      <p class="evolution-description">
        現在確認できている進化先・進化前はありません。
      </p>

      <div class="evolution-chain">

        ${evolutionCharacterHTML(
          baseCharacter,
          baseCharacter.dexNo
        )}

      </div>

      ${
        currentCharacter.key !== baseCharacter.key
        ?
        `
          <div class="evolution-form-note">
            ※ 現在表示している
            「${currentCharacter.formName || currentCharacter.name}」は
            別形態です。進化情報は同じ図鑑番号の代表形態を基準に表示しています。
          </div>
        `
        :
        ""
      }

    `;
  }

  let html = `

    <p class="evolution-description">
      通常・代表形態を基準に、進化系統全体を表示しています。
    </p>

    <div class="evolution-chain">

  `;

  stages.forEach((stage,index) => {

    html += `

      <div class="evolution-stage">

        <div class="evolution-stage-label">
          進化段階 ${index + 1}
        </div>

        <div class="evolution-stage-list">

    `;

    stage.forEach(item => {

      html += evolutionCharacterHTML(
        item.character,
        baseCharacter.dexNo,
        item.text || ""
      );

    });

    html += `

        </div>

      </div>

    `;

    if(index < stages.length - 1){

      html += `
        <div class="evolution-arrow">
          ↓
        </div>
      `;

    }

  });

  html += `
    </div>
  `;

  if(
    currentCharacter.key !==
    baseCharacter.key
  ){

    html += `

      <div class="evolution-form-note">

        ※ 現在表示している
        「${currentCharacter.formName || currentCharacter.name}」は
        別形態です。

        進化系統は同じ図鑑番号の
        「${baseCharacter.formName || baseCharacter.name}」を
        基準に表示しています。

      </div>

    `;

  }

  return html;
}
