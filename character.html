<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>キャラクター詳細 | ロコキングダム速報</title>

<meta name="description"
content="Roco Kingdom（洛克王国：世界）のキャラクター性能・種族値・属性相性・特性・技・進化・入手方法を日本語でまとめています。">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  color:#17324d;
  line-height:1.7;
  background:#f1f8fd;
}

header{
  padding:25px 16px;
  text-align:center;
  color:white;
  background:linear-gradient(135deg,#50b7f0,#79d4ff);
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:5px 0 0;
  font-size:13px;
}

.back{
  display:block;
  padding:14px 18px;
  background:white;
  border-bottom:1px solid #dceaf4;
  color:#1677d2;
  text-decoration:none;
  font-weight:800;
}

main{
  width:min(850px,calc(100% - 24px));
  margin:18px auto 50px;
}

.card{
  margin-bottom:16px;
  padding:19px;
  background:white;
  border:1px solid #dceaf3;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(30,90,130,.08);
}

.card h2{
  margin:0 0 14px;
  font-size:20px;
}


/* =========================
   キャラクター
========================= */

.hero{
  text-align:center;
  overflow:hidden;
}

.character-image{
  height:220px;
  margin:-19px -19px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,#fff,#e5f5ff);
  font-size:85px;
}

.character-image img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:15px;
}

.no{
  color:#7890a4;
  font-size:13px;
  font-weight:800;
}

.name{
  margin:3px 0 0;
  color:#126fc1;
  font-size:29px;
  font-weight:900;
}

.cn{
  margin-top:2px;
  color:#7b90a2;
  font-size:13px;
}

.types{
  margin-top:10px;
}

.type{
  display:inline-block;
  margin:2px;
  padding:5px 15px;
  border-radius:999px;
  color:white;
  font-size:13px;
  font-weight:800;
}

.type-normal{background:#929292}
.type-grass{background:#58ad55}
.type-fire{background:#ed6253}
.type-water{background:#479fe8}
.type-light{background:#e4ad25}
.type-ground{background:#aa8151}
.type-ice{background:#68c6dc}
.type-dragon{background:#7654b5}
.type-electric{background:#e4b91f}
.type-poison{background:#985ca9}
.type-bug{background:#82a938}
.type-fighting{background:#c46d3b}
.type-wing{background:#78a7d1}
.type-cute{background:#e77aa6}
.type-ghost{background:#756294}
.type-dark{background:#62536e}
.type-machine{background:#6e8290}
.type-illusion{background:#a767b5}

.total{
  margin-top:10px;
  font-weight:900;
}


/* =========================
   形態切り替え
========================= */

.form-card{
  border-left:6px solid #52afe7;
}

.form-description{
  margin:-5px 0 13px;
  color:#71899b;
  font-size:12px;
}

.form-buttons{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:8px;
}

.form-button{
  display:flex;
  min-height:56px;
  padding:10px 8px;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:1px solid #cfe2ee;
  border-radius:13px;
  background:#f3f9fd;
  color:#29475f;
  text-decoration:none;
  font-size:13px;
  font-weight:900;
  line-height:1.35;
}

.form-button.active{
  border-color:#1689e8;
  background:#1689e8;
  color:white;
  box-shadow:
    0 4px 12px rgba(22,137,232,.22);
}


/* =========================
   確認状況
========================= */

.data-status{
  margin-top:16px;
  padding:12px 14px;
  text-align:left;
  border-radius:13px;
}

.data-status.confirmed{
  background:#eaf9ef;
  border:1px solid #a9dfb9;
  color:#246d3b;
}

.data-status.checking{
  background:#fff8df;
  border:1px solid #efd680;
  color:#806315;
}

.data-status-title{
  font-size:14px;
  font-weight:900;
}

.data-status-detail{
  margin-top:3px;
  font-size:11px;
}


/* =========================
   ステータス
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.stat{
  padding:12px 5px;
  text-align:center;
  border-radius:12px;
  background:#f2f8fc;
}

.stat-name{
  display:block;
  color:#6b8396;
  font-size:12px;
  font-weight:700;
}

.stat-value{
  display:block;
  font-size:21px;
  font-weight:900;
}


/* =========================
   属性相性
========================= */

.matchup-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.matchup{
  padding:14px;
  border-radius:14px;
}

.matchup.weak{
  background:#fff0f0;
  border:1px solid #f1b7b7;
}

.matchup.resist{
  background:#eef9f1;
  border:1px solid #b7dfc0;
}

.matchup-title{
  margin-bottom:8px;
  font-weight:900;
}

.matchup-tag{
  display:inline-block;
  margin:3px;
  padding:4px 9px;
  border-radius:999px;
  background:white;
  font-size:12px;
  font-weight:800;
}


/* =========================
   特性
========================= */

.trait{
  padding:15px;
  border-radius:13px;
  background:#fff9e6;
  border:1px solid #efd98b;
}

.trait strong{
  display:block;
  color:#a97200;
}

.original{
  color:#7b8c99;
  font-size:12px;
}


/* =========================
   技
========================= */

.skill-group{
  margin-top:20px;
}

.skill-group:first-child{
  margin-top:0;
}

.skill-group-title{
  margin-bottom:6px;
  padding:10px 12px;
  border-radius:12px;
  background:#edf8ff;
  color:#126fc1;
  font-weight:900;
}

.skill-count{
  color:#71899b;
  font-size:11px;
  font-weight:700;
}

.skill{
  padding:14px 2px;
  border-bottom:1px solid #e4edf3;
}

.skill:last-child{
  border-bottom:0;
}

.skill-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.skill-name{
  color:#126fc1;
  font-weight:900;
}

.skill-level{
  color:#7890a3;
  font-size:11px;
}

.skill-original{
  color:#8a9ba8;
  font-size:11px;
}

.skill-tags{
  margin:6px 0;
}

.tag{
  display:inline-block;
  margin:2px 3px 2px 0;
  padding:2px 7px;
  border-radius:999px;
  background:#edf4f8;
  font-size:10px;
  font-weight:800;
}

.skill-effect{
  color:#4f687b;
  font-size:13px;
}


/* =========================
   その他
========================= */

.evolution-item{
  margin:7px 0;
  padding:12px;
  text-align:center;
  border-radius:12px;
  background:#edf8ff;
  color:#126fc1;
  font-weight:800;
}

.notice{
  padding:15px;
  border-radius:14px;
  background:#fff9e7;
  border:1px solid #efdb96;
  color:#66582b;
  font-size:12px;
}

.empty{
  color:#8194a3;
  font-size:13px;
}

.error{
  padding:30px 20px;
  text-align:center;
  background:white;
  border-radius:18px;
}

.error a{
  color:#1677d2;
  font-weight:800;
}


/* =========================
   スマホ
========================= */

@media(max-width:400px){

  .character-image{
    height:190px;
  }

  .name{
    font-size:25px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .matchup-grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>


<body>

<header>

  <h1>🐾 キャラクター詳細</h1>

  <p>
    ロコキングダム速報 攻略図鑑
  </p>

</header>


<a class="back" href="pokedex.html">
  ← キャラ図鑑へ戻る
</a>


<main id="content">

  <div class="card">
    読み込み中...
  </div>

</main>


<script src="characters.js"></script>


<script>

/* ==================================================
   基本
================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const requestedKey =
  params.get("key");

const requestedId =
  Number(
    params.get("id")
  );

const content =
  document.getElementById("content");


/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ==================================================
   図鑑番号
================================================== */

function getDexNo(character){

  if(
    character.dexNo !== undefined &&
    character.dexNo !== null &&
    character.dexNo !== ""
  ){

    return String(
      character.dexNo
    ).padStart(3,"0");

  }

  return String(
    character.id
  ).padStart(3,"0");

}


/* ==================================================
   最初に表示するキャラクター
================================================== */

function findRequestedCharacter(){

  /*
   keyがある場合は
   keyを最優先
  */

  if(requestedKey){

    const byKey =
      characters.find(
        character =>
          character.key === requestedKey
      );

    if(byKey){
      return byKey;
    }

  }


  /*
   古いURL
   ?id=18
   にも対応
  */

  if(
    !Number.isNaN(requestedId)
  ){

    const sameId =
      characters.filter(
        character =>
          Number(character.id) ===
          requestedId
      );


    if(sameId.length){

      /*
       mainを優先
      */

      const main =
        sameId.find(
          character =>
            character.form === "main"
        );

      if(main){
        return main;
      }


      /*
       通常形態を優先
      */

      const normal =
        sameId.find(
          character =>
            character.formName ===
            "通常形態"
        );

      if(normal){
        return normal;
      }


      /*
       本来の姿を優先
      */

      const original =
        sameId.find(
          character =>
            character.formName ===
            "本来の姿"
        );

      if(original){
        return original;
      }


      return sameId[0];

    }

  }


  return null;

}


const character =
  findRequestedCharacter();


/* ==================================================
   同じ図鑑番号の全形態
================================================== */

function getForms(character){

  if(!character){
    return [];
  }

  const dexNo =
    getDexNo(character);

  return characters.filter(
    item =>
      getDexNo(item) === dexNo
  );

}


/* ==================================================
   形態名
================================================== */

function getFormLabel(form,index){

  if(form.formName){

    return form.formName;

  }

  if(form.variantName){

    return form.variantName;

  }

  if(form.form === "main"){

    return "通常形態";

  }

  /*
   形態名がまだ設定されていない場合
  */

  if(index === 0){

    return "通常形態";

  }

  return `別形態 ${index + 1}`;

}


/* ==================================================
   形態切り替えHTML
================================================== */

function createFormsHTML(character){

  const forms =
    getForms(character);

  /*
   1形態しかない場合は
   切り替え欄を表示しない
  */

  if(forms.length <= 1){

    return "";

  }


  const buttons =
    forms.map(
      (form,index) => {

        const active =
          form === character;

        const label =
          getFormLabel(
            form,
            index
          );


        const query =
          new URLSearchParams();


        if(form.key){

          query.set(
            "key",
            form.key
          );

        }


        query.set(
          "id",
          form.id
        );


        return `
          <a
            class="form-button ${active ? "active" : ""}"
            href="character.html?${query.toString()}">

            ${escapeHTML(label)}

          </a>
        `;

      }
    )
    .join("");


  return `

    <section class="card form-card">

      <h2>
        🔄 形態切り替え
      </h2>

      <p class="form-description">
        このキャラクターには複数の形態があります。
        表示したい形態を選択してください。
      </p>

      <div class="form-buttons">

        ${buttons}

      </div>

    </section>

  `;

}


/* ==================================================
   技
================================================== */

function skillHTML(skill){

  const level =
    skill.level !== undefined &&
    skill.level !== null
      ? `Lv.${escapeHTML(skill.level)}`
      : "";


  const power =
    skill.power === null ||
    skill.power === undefined
      ? ""
      : `
        <span class="tag">
          威力 ${escapeHTML(skill.power)}
        </span>
      `;


  const cost =
    skill.cost === null ||
    skill.cost === undefined
      ? ""
      : `
        <span class="tag">
          消費 ${escapeHTML(skill.cost)}
        </span>
      `;


  return `

    <div class="skill">

      <div class="skill-top">

        <span class="skill-name">
          ${escapeHTML(
            skill.name || "名称確認中"
          )}
        </span>

        <span class="skill-level">
          ${level}
        </span>

      </div>


      <div class="skill-original">

        中国名：
        ${escapeHTML(
          skill.chineseName || "確認中"
        )}

      </div>


      <div class="skill-tags">

        ${
          skill.type
            ? `
              <span class="tag">
                ${escapeHTML(skill.type)}
              </span>
            `
            : ""
        }

        ${
          skill.category
            ? `
              <span class="tag">
                ${escapeHTML(skill.category)}
              </span>
            `
            : ""
        }

        ${power}

        ${cost}

      </div>


      <div class="skill-effect">

        ${escapeHTML(
          skill.description || ""
        )}

      </div>

    </div>

  `;

}


/* ==================================================
   技グループ
================================================== */

function skillGroup(
  title,
  icon,
  list
){

  if(
    !Array.isArray(list) ||
    list.length === 0
  ){

    return `

      <div class="skill-group">

        <div class="skill-group-title">

          ${icon}
          ${escapeHTML(title)}

        </div>

        <p class="empty">
          現在データ整理中です。
        </p>

      </div>

    `;

  }


  return `

    <div class="skill-group">

      <div class="skill-group-title">

        ${icon}
        ${escapeHTML(title)}

        <span class="skill-count">
          （${list.length}）
        </span>

      </div>

      ${list.map(skillHTML).join("")}

    </div>

  `;

}


/* ==================================================
   キャラクターが見つからない
================================================== */

if(!character){

  content.innerHTML=`

    <div class="error">

      <h2>
        キャラクターが見つかりません
      </h2>

      <p>
        URLまたは図鑑データを確認してください。
      </p>

      <a href="pokedex.html">
        ← キャラ図鑑へ戻る
      </a>

    </div>

  `;

}else{


/* ==================================================
   タイトル
================================================== */

const displayName =
  character.name ||
  character.chineseName ||
  "名称確認中";


document.title =
  `${displayName}の性能・技 | ロコキングダム速報`;


/* ==================================================
   画像
================================================== */

let imageHTML;


if(
  character.image &&
  String(character.image).trim() !== ""
){

  imageHTML=`

    <img
      src="${escapeHTML(character.image)}"
      alt="${escapeHTML(displayName)}">

  `;

}else{

  const firstType =
    Array.isArray(character.type)
      ? character.type[0]
      : "normal";


  imageHTML =
    typeData[firstType]?.icon ||
    "🐾";

}


/* ==================================================
   属性
================================================== */

const characterTypes =
  Array.isArray(character.type)
    ? character.type
    : [];


const typeHTML =
  characterTypes.map(
    (type,index) => {

      const name =
        character.typeName?.[index]
        ||
        typeData[type]?.name
        ||
        type;


      return `

        <span
          class="type type-${escapeHTML(type)}">

          ${escapeHTML(
            typeData[type]?.icon || ""
          )}

          ${escapeHTML(name)}

        </span>

      `;

    }
  )
  .join("");


/* ==================================================
   種族値合計
================================================== */

const totalHTML =

  character.total === null ||
  character.total === undefined ||
  character.total === ""

    ? "確認中"

    : escapeHTML(
        character.total
      );


/* ==================================================
   確認状況
================================================== */

const confirmed =
  character.dataStatus ===
  "confirmed";


const dataStatusHTML = `

<div
  class="data-status ${confirmed ? "confirmed" : "checking"}">

  <div class="data-status-title">

    ${
      confirmed
        ? "✅ 中国版データ確認済み"
        : "⚠️ データ確認中"
    }

  </div>


  <div class="data-status-detail">

    ${escapeHTML(
      character.dataVersion ||
      "中国版"
    )}

    <br>

    最終確認：
    ${escapeHTML(
      character.checkedDate ||
      "未設定"
    )}

  </div>

</div>

`;


/* ==================================================
   属性相性
================================================== */

function matchupTags(
  list,
  multiplier
){

  if(
    !Array.isArray(list) ||
    list.length === 0
  ){

    return `
      <span class="empty">
        現在確認中
      </span>
    `;

  }


  return list.map(type => {

    const data =
      typeData[type];


    return `

      <span class="matchup-tag">

        ${escapeHTML(
          data?.icon || ""
        )}

        ${escapeHTML(
          data?.name || type
        )}

        ${escapeHTML(multiplier)}

      </span>

    `;

  }).join("");

}


const matchupHTML = `

<div class="matchup-grid">

  <div class="matchup weak">

    <div class="matchup-title">
      ⚠️ 弱点
    </div>

    ${matchupTags(
      character.weaknesses,
      "×2"
    )}

  </div>


  <div class="matchup resist">

    <div class="matchup-title">
      🛡️ 耐性
    </div>

    ${matchupTags(
      character.resistances,
      "×0.5"
    )}

  </div>

</div>

`;


/* ==================================================
   特性
================================================== */

let abilityHTML;


if(character.ability){

  abilityHTML = `

    <div class="trait">

      <strong>

        ${escapeHTML(
          character.ability.name ||
          "名称確認中"
        )}

      </strong>


      <div class="original">

        中国名：
        ${escapeHTML(
          character.ability.chineseName ||
          "確認中"
        )}

      </div>


      <div>

        ${escapeHTML(
          character.ability.description ||
          "効果を確認中です。"
        )}

      </div>

    </div>

  `;

}else{

  abilityHTML = `
    <p class="empty">
      現在データ整理中です。
    </p>
  `;

}


/* ==================================================
   技
================================================== */

let levelSkills = [];
let stoneSkills = [];
let bloodlineSkills = [];


if(
  Array.isArray(character.skills)
){

  levelSkills =
    character.skills;

}else if(character.skills){

  levelSkills =
    character.skills.level || [];

  stoneSkills =
    character.skills.stone || [];

  bloodlineSkills =
    character.skills.bloodline || [];

}


const skillsHTML =

  skillGroup(
    "レベル習得",
    "📈",
    levelSkills
  )

  +

  skillGroup(
    "技能石",
    "💎",
    stoneSkills
  )

  +

  skillGroup(
    "血脈技",
    "🧬",
    bloodlineSkills
  );


/* ==================================================
   進化
================================================== */

let evolutionHTML;


if(
  Array.isArray(character.evolution) &&
  character.evolution.length
){

  evolutionHTML =
    character.evolution
      .map(
        evolution => `

          <div class="evolution-item">

            ${escapeHTML(evolution)}

          </div>

        `
      )
      .join("");

}else{

  evolutionHTML = `

    <p class="empty">
      進化情報は現在整理中です。
    </p>

  `;

}


/* ==================================================
   ステータス

   データが無い場合は
   確認中
================================================== */

const stats =
  character.stats || {};


function statValue(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "確認中";

  }

  return escapeHTML(value);

}


/* ==================================================
   形態切り替え
================================================== */

const formsHTML =
  createFormsHTML(character);


/* ==================================================
   描画
================================================== */

content.innerHTML = `

<section class="card hero">

  <div class="character-image">

    ${imageHTML}

  </div>


  <div class="no">

    NO.${escapeHTML(
      getDexNo(character)
    )}

  </div>


  <div class="name">

    ${escapeHTML(displayName)}

    ${
