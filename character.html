<body>

<header>
  <h1>🐾 キャラクター詳細</h1>
  <p>ロコキングダム速報 攻略図鑑</p>
</header>

<a class="back" href="pokedex.html">
  ← キャラ図鑑へ戻る
</a>

<main id="content">
  <div class="card">
    読み込み中...
  </div>
</main>

<script src="characters.js"></script>

<script>

/* ==========================================
   URL
========================================== */

const params =
  new URLSearchParams(window.location.search);

const keyParam =
  params.get("key");

const idParam =
  Number(params.get("id"));


/* ==========================================
   キャラクター取得
========================================== */

let character = null;

if(keyParam){

  character =
    characters.find(
      c => c.key === keyParam
    );

}

if(!character && idParam){

  character =
    characters.find(
      c =>
        c.id === idParam
        &&
        c.form === "main"
    )
    ||
    characters.find(
      c => c.id === idParam
    );

}

const content =
  document.getElementById("content");


/* ==========================================
   共通
========================================== */

function displayValue(value){

  if(
    value === null
    ||
    value === undefined
    ||
    value === ""
  ){
    return "確認中";
  }

  return value;

}


/* ==========================================
   技
========================================== */

function skillHTML(skill){

  const level =
    skill.level !== undefined
    &&
    skill.level !== null
    ? `Lv.${skill.level}`
    : "";

  const power =
    skill.power === null
    ||
    skill.power === undefined
    ? ""
    : `<span class="tag">威力 ${skill.power}</span>`;

  const cost =
    skill.cost === null
    ||
    skill.cost === undefined
    ? ""
    : `<span class="tag">消費 ${skill.cost}</span>`;

  return `

    <div class="skill">

      <div class="skill-top">

        <span class="skill-name">
          ${skill.name || "名称確認中"}
        </span>

        <span class="skill-level">
          ${level}
        </span>

      </div>

      ${
        skill.chineseName
        ?
        `
        <div class="skill-original">
          中国名：${skill.chineseName}
        </div>
        `
        :
        ""
      }

      <div class="skill-tags">

        ${
          skill.type
          ?
          `<span class="tag">${skill.type}</span>`
          :
          ""
        }

        ${
          skill.category
          ?
          `<span class="tag">${skill.category}</span>`
          :
          ""
        }

        ${power}
        ${cost}

      </div>

      <div class="skill-effect">
        ${skill.description || "効果確認中"}
      </div>

    </div>

  `;

}


function skillGroup(title,icon,list){

  if(
    !list
    ||
    list.length === 0
  ){

    return `

      <div class="skill-group">

        <div class="skill-group-title">
          ${icon} ${title}
        </div>

        <p class="empty">
          現在データ整理中です。
        </p>

      </div>

    `;

  }

  return `

    <div class="skill-group">

      <div class="skill-group-title">

        ${icon} ${title}

        <span class="skill-count">
          （${list.length}）
        </span>

      </div>

      ${list.map(skillHTML).join("")}

    </div>

  `;

}


/* ==========================================
   形態一覧
========================================== */

function getRelatedForms(character){

  const keys =
    Array.isArray(character.forms)
    ? character.forms
    : [];

  const found = [];

  keys.forEach(key => {

    const form =
      characters.find(
        c => c.key === key
      );

    if(
      form
      &&
      !found.some(
        item => item.key === form.key
      )
    ){
      found.push(form);
    }

  });

  characters.forEach(form => {

    if(
      form.dexNo === character.dexNo
      &&
      !found.some(
        item => item.key === form.key
      )
    ){
      found.push(form);
    }

  });

  return found;

}


function createFormsHTML(character){

  const forms =
    getRelatedForms(character);

  if(forms.length <= 1){
    return "";
  }

  const buttons =
    forms.map(form => {

      const active =
        form.key === character.key;

      const boss =
        form.isBossForm === true;

      const label =
        form.formName
        ||
        form.name;

      return `

        <a
          class="
            form-button
            ${active ? "active" : ""}
            ${boss ? "boss" : ""}
          "
          href="character.html?key=${encodeURIComponent(form.key)}">

          ${boss ? "👑 " : ""}
          ${label}

        </a>

      `;

    }).join("");

  return `

    <section class="card forms-card">

      <h2>
        🔄 形態切り替え
      </h2>

      <p class="forms-description">
        このキャラクターには複数の形態があります。
        表示したい形態を選択してください。
      </p>

      <div class="form-switcher">
        ${buttons}
      </div>

    </section>

  `;

}


/* ==========================================
   進化番号抽出
========================================== */

function getEvolutionDexNo(text){

  if(!text){
    return null;
  }

  const matches =
    String(text).match(
      /\b(\d{1,3})\b/g
    );

  if(
    !matches
    ||
    matches.length === 0
  ){
    return null;
  }

  const last =
    matches[
      matches.length - 1
    ];

  return String(last)
    .padStart(3,"0");

}


/* ==========================================
   進化系統で使用できる通常形態
========================================== */

function isEvolutionMainForm(character){

  if(!character){
    return false;
  }

  if(
    character.form === "season"
    ||
    character.form === "boss"
    ||
    character.isBossForm === true
  ){
    return false;
  }

  return true;

}


/* ==========================================
   図鑑番号から代表形態を取得
========================================== */

function getMainEvolutionCharacter(dexNo){

  if(!dexNo){
    return null;
  }

  const sameDex =
    characters.filter(
      c => c.dexNo === dexNo
    );

  if(sameDex.length === 0){
    return null;
  }

  const main =
    sameDex.find(
      c => c.form === "main"
    );

  if(main){
    return main;
  }

  const normal =
    sameDex.find(
      c =>
        c.form !== "season"
        &&
        c.form !== "boss"
        &&
        c.isBossForm !== true
    );

  return normal || sameDex[0];

}


/* ==========================================
   evolution配列を解析
========================================== */

function getRawEvolutionTargets(character){

  if(
    !character
    ||
    !Array.isArray(character.evolution)
    ||
    character.evolution.length === 0
  ){
    return [];
  }

  const result = [];

  character.evolution.forEach(text => {

    const dexNo =
      getEvolutionDexNo(text);

    if(!dexNo){
      return;
    }

    const target =
      getMainEvolutionCharacter(dexNo);

    if(
      target
      &&
      target.dexNo !== character.dexNo
      &&
      !result.some(
        item =>
          item.character.dexNo ===
          target.dexNo
      )
    ){

      result.push({
        character:target,
        text:text
      });

    }

  });

  return result;

}


/* ==========================================
   あるキャラから別キャラへ
   evolution経由で到達できるか確認

   例：
   019 → 020 が可能なら true
========================================== */

function canReachEvolution(
  startCharacter,
  targetDexNo,
  visited = new Set()
){

  if(!startCharacter){
    return false;
  }

  if(
    visited.has(
      startCharacter.dexNo
    )
  ){
    return false;
  }

  const nextVisited =
    new Set(visited);

  nextVisited.add(
    startCharacter.dexNo
  );

  const targets =
    getRawEvolutionTargets(
      startCharacter
    );

  for(const item of targets){

    if(
      item.character.dexNo ===
      targetDexNo
    ){
      return true;
    }

    if(
      canReachEvolution(
        item.character,
        targetDexNo,
        nextVisited
      )
    ){
      return true;
    }

  }

  return false;

}


/* ==========================================
   「直接」の進化先だけ取得

   重要：
   018のevolutionに
   019と020が両方あっても、

   019 → 020

   が成立するなら
   020は018の直接進化先から除外。

   そのため

   018
    ↓
   019
    ↓
   020

   になる。
========================================== */

function getEvolutionTargets(character){

  const rawTargets =
    getRawEvolutionTargets(character);

  if(rawTargets.length <= 1){
    return rawTargets;
  }

  return rawTargets.filter(
    candidate => {

      /*
       candidate以外の進化先から
       candidateへ到達できる場合、
       candidateは「さらに先の進化」
       と判断する
      */

      const hasIntermediate =
        rawTargets.some(
          other => {

            if(
              other.character.dexNo ===
              candidate.character.dexNo
            ){
              return false;
            }

            return canReachEvolution(
              other.character,
              candidate.character.dexNo
            );

          }
        );

      return !hasIntermediate;

    }
  );

}


/* ==========================================
   直接の進化前を逆引き

   ここでも
   getEvolutionTargets() を使うことで
   途中段階を飛ばした進化を除外
========================================== */

function getPreEvolutionCharacters(character){

  if(!character){
    return [];
  }

  const currentDex =
    character.dexNo;

  const result = [];

  const mainCharacters = [];

  characters.forEach(source => {

    if(
      !isEvolutionMainForm(source)
    ){
      return;
    }

    const representative =
      getMainEvolutionCharacter(
        source.dexNo
      );

    if(
      representative
      &&
      !mainCharacters.some(
        item =>
          item.dexNo ===
          representative.dexNo
      )
    ){
      mainCharacters.push(
        representative
      );
    }

  });


  mainCharacters.forEach(source => {

    const directTargets =
      getEvolutionTargets(source);

    directTargets.forEach(item => {

      if(
        item.character.dexNo ===
        currentDex
        &&
        source.dexNo !== currentDex
      ){

        if(
          !result.some(
            existing =>
              existing.character.dexNo ===
              source.dexNo
          )
        ){

          result.push({
            character:source,
            text:item.text
          });

        }

      }

    });

  });

  return result;

}


/* ==========================================
   進化系統の最初まで戻る
========================================== */

function findEvolutionRoots(
  character,
  visited = new Set()
){

  if(!character){
    return [];
  }

  if(
    visited.has(
      character.dexNo
    )
  ){
    return [character];
  }

  const nextVisited =
    new Set(visited);

  nextVisited.add(
    character.dexNo
  );

  const previous =
    getPreEvolutionCharacters(
      character
    );

  if(previous.length === 0){
    return [character];
  }

  let roots = [];

  previous.forEach(item => {

    roots.push(
      ...findEvolutionRoots(
        item.character,
        nextVisited
      )
    );

  });

  return roots.filter(
    (item,index,array) =>
      array.findIndex(
        other =>
          other.dexNo === item.dexNo
      ) === index
  );

}


/* ==========================================
   進化系統全体を作成
========================================== */

function buildEvolutionStages(roots){

  const stages = [];

  let currentStage =
    roots.map(character => ({
      character:character,
      text:""
    }));

  const globallyVisited =
    new Set();


  while(
    currentStage.length > 0
    &&
    stages.length < 30
  ){

    const uniqueStage = [];

    currentStage.forEach(item => {

      if(
        !uniqueStage.some(
          existing =>
            existing.character.dexNo ===
            item.character.dexNo
        )
      ){

        uniqueStage.push(item);

      }

    });


    if(uniqueStage.length === 0){
      break;
    }


    stages.push(
      uniqueStage
    );


    const nextStage = [];

    uniqueStage.forEach(item => {

      const source =
        item.character;

      globallyVisited.add(
        source.dexNo
      );

      const targets =
        getEvolutionTargets(
          source
        );

      targets.forEach(targetItem => {

        if(
          globallyVisited.has(
            targetItem.character.dexNo
          )
        ){
          return;
        }

        const existing =
          nextStage.find(
            nextItem =>
              nextItem.character.dexNo ===
              targetItem.character.dexNo
          );

        if(!existing){

          nextStage.push(
            targetItem
          );

        }

      });

    });


    currentStage =
      nextStage;

  }

  return stages;

}

function evolutionCharacterHTML(

  currentDex,
  note = ""
){

  const isCurrent =

  if(isCurrent){

    return `

          note
          ?
          `

            ${note}
          </span>
          `
          :
          ""
        }

      </div>

    `;

  }


  return `

    <a
      class="evolution-link"
      href="character.html?key=${encodeURIComponent(target.key)}">

      <span class="evolution-number">
        NO.${target.dexNo}
      </span>

      <span class="evolution-name">

        🐾 ${target.name}

}


/* ==========================================
   進化系統全体表示
========================================== */

function createEvolutionHTML(character){

  /*
   季節形態・首領形態の場合は
   同じ図鑑番号の通常形態を基準にする
  */

  let baseCharacter =
    character;

  if(
    character.form === "season"
    ||
    character.form === "boss"
    ||
    character.isBossForm === true
  ){

    baseCharacter =
      getMainEvolutionCharacter(
        character.dexNo
      )
      ||
      character;

  }


  const roots =
    findEvolutionRoots(
      baseCharacter
    );


  const stages =
    buildEvolutionStages(
      roots.length
      ? roots
      : [baseCharacter]
    );


  if(
    !stages
    ||
    stages.length === 0
  ){

    return `

      <div class="evolution-none">
        進化情報は現在確認中です。
      </div>

    `;

  }


  let html = `

    <p class="evolution-description">
      通常形態を基準に、進化系統全体を表示しています。
    </p>

    <div class="evolution-chain">

  `;


  stages.forEach(
    (stage,index) => {

      html += `

        <div class="evolution-stage">

          <div class="evolution-stage-label">

            ${
              stages.length === 1
              ? "現在"
              : `進化段階 ${index + 1}`
            }

          </div>

          <div class="evolution-stage-list">

      `;


      stage.forEach(item => {

        html +=
          evolutionCharacterHTML(
            item.character,
            baseCharacter.dexNo,
            item.text || ""
          );

      });


      html += `

          </div>

        </div>

      `;


      if(
        index <
        stages.length - 1
      ){

        html += `

          <div class="evolution-arrow">
            ↓
          </div>

        `;

      }

    }
  );


  html += `
    </div>
  `;


  if(
    character.key !==
    baseCharacter.key
  ){

    html += `

      <div class="evolution-form-note">

        ※ 現在表示している
        「${character.formName || character.name}」は
        別形態のため、進化系統は
        通常形態「${baseCharacter.name}」を
        基準に表示しています。

      </div>

    `;

  }


  return html;

}
