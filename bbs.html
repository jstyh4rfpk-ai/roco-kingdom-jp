<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>ロコキングダム掲示板</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(rgba(235,248,255,.88), rgba(235,248,255,.94)),
        url("IMG_0596.png") center top / cover fixed;
      color: #17324d;
    }

    header {
      padding: 55px 20px 45px;
      text-align: center;
      color: white;

      background:
        linear-gradient(
          rgba(40,110,180,.28),
          rgba(40,110,180,.28)
        ),
        url("52F37108-E234-43A0-BEB0-D8DD6C52AEA7.png")
        center center / cover no-repeat;

      box-shadow: 0 4px 20px rgba(0,0,0,.12);
    }

    header h1 {
      margin: 0;
      font-size: clamp(34px,9vw,58px);
      line-height: 1.2;
      text-shadow: 0 2px 8px rgba(0,0,0,.20);
    }

    header p {
      margin: 14px 0 0;
      font-size: 17px;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0,0,0,.20);
    }

    .badge {
      display: inline-block;
      margin-top: 18px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,.22);
      border: 1px solid rgba(255,255,255,.55);
      color: white;
    }

    main {
      width: min(900px, calc(100% - 24px));
      margin: 24px auto 50px;
    }

    .back {
      display: inline-block;
      margin: 4px 0 18px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      color: #1478c9;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .panel {
      background: rgba(255,255,255,.95);
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 28px rgba(40,100,150,.10);
      border: 1px solid rgba(150,200,230,.25);
    }

    .panel h2 {
      margin-top: 0;
      font-size: 26px;
    }

    input,
    textarea,
    button {
      width: 100%;
      font: inherit;
    }

    input,
    textarea {
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #c9dcea;
      border-radius: 14px;
      background: rgba(255,255,255,.95);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 14px;
      padding: 14px;
      margin-top: 9px;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(135deg,#43a9ff,#2398ed);
      color: white;
    }

    .secondary {
      background: #71869a;
    }

    .topic-wrap {
      margin: 14px 0;
    }

    .topic {
      display: block;
      padding: 18px;
      border: 1px solid #d7e8f3;
      border-radius: 18px;
      background: linear-gradient(
        135deg,
        rgba(247,252,255,.98),
        rgba(235,247,255,.98)
      );
      color: #17324d;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(40,100,150,.05);
    }

    .topic:active {
      transform: scale(.99);
    }

    .topic-title {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.5;
    }

    .topic-description {
      margin-top: 9px;
      line-height: 1.65;
    }

    .topic-meta {
      margin-top: 10px;
      font-size: 13px;
      color: #718397;
    }

    .comment-count {
      color: #1478c9;
      font-weight: 800;
    }

    .delete-topic-button {
      margin-top: 8px;
      background: #df5353;
    }

    .status {
      font-size: 14px;
      color: #63788c;
    }

    .hidden {
      display: none;
    }

    .admin-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #e8f6ff;
      color: #1478c9;
      font-size: 13px;
      font-weight: 800;
    }
  </style>
</head>

<body>

<header>
  <h1>💬 ロコキングダム掲示板</h1>

  <p>
    Roco Kingdom（洛克王国：世界）<br>
    日本向け交流掲示板 🇯🇵
  </p>

  <div class="badge">
    非公式ファンサイト
  </div>
</header>

<main>

  <a class="back" href="index.html">
    ← ロコキングダム速報へ戻る
  </a>

  <section class="panel">
    <h2>💬 トピック一覧</h2>

    <p class="status" id="loading">
      読み込み中...
    </p>

    <div id="topic-list"></div>
  </section>

  <section class="panel" id="login-panel">
    <h2>🔐 管理人ログイン</h2>

    <p class="status">
      トピック作成・削除は管理人のみです。
    </p>

    <input
      id="email"
      type="email"
      placeholder="管理人メールアドレス"
    >

    <input
      id="password"
      type="password"
      placeholder="パスワード"
    >

    <button id="login-button">
      ログイン
    </button>

    <p class="status" id="login-message"></p>
  </section>

  <section
    class="panel hidden"
    id="admin-panel"
  >
    <span class="admin-badge">
      管理人モード
    </span>

    <h2>＋ 新しいトピックを作成</h2>

    <input
      id="topic-title"
      type="text"
      maxlength="100"
      placeholder="トピックタイトル"
    >

    <input
      id="topic-category"
      type="text"
      maxlength="40"
      placeholder="カテゴリ（例：CBT）"
    >

    <textarea
      id="topic-description"
      maxlength="500"
      placeholder="説明文（任意）"
    ></textarea>

    <button id="create-topic-button">
      トピックを作成
    </button>

    <button
      id="logout-button"
      class="secondary"
    >
      管理人ログアウト
    </button>

    <p class="status" id="admin-message"></p>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    "https://vjdttnlrkceesmmvbnym.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_smTxr916q6a0_c_-PuOY5w_JDTAxziW";

  const ADMIN_UID =
    "5ceedf79-fee7-4159-bb82-a19848e5858f";

  const client = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const topicList =
    document.getElementById("topic-list");

  const loading =
    document.getElementById("loading");

  const loginPanel =
    document.getElementById("login-panel");

  const adminPanel =
    document.getElementById("admin-panel");

  let isAdmin = false;

  function escapeHTML(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function formatDate(value) {
    return new Date(value).toLocaleString(
      "ja-JP",
      {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }
    );
  }

  async function checkAdmin() {
    const {
      data: { session }
    } = await client.auth.getSession();

    isAdmin =
      session?.user?.id === ADMIN_UID;
  }

  async function loadTopics() {

    loading.textContent = "読み込み中...";

    const {
      data: topics,
      error: topicError
    } = await client
      .from("topics")
      .select("*")
      .order("is_pinned", {
        ascending: false
      })
      .order("created_at", {
        ascending: false
      });

    if (topicError) {
      loading.textContent =
        "トピックの読み込みに失敗しました。";

      console.error(topicError);
      return;
    }

    const {
      data: comments,
      error: commentError
    } = await client
      .from("comments")
      .select("topic_id");

    if (commentError) {
      loading.textContent =
        "コメント件数を読み込めませんでした。";

      console.error(commentError);
      return;
    }

    const counts = {};

    comments.forEach(comment => {
      counts[comment.topic_id] =
        (counts[comment.topic_id] || 0) + 1;
    });

    loading.textContent = "";

    if (!topics.length) {
      topicList.innerHTML =
        "<p>まだトピックはありません。</p>";
      return;
    }

    topicList.innerHTML =
      topics.map(topic => {

        const pinned =
          topic.is_pinned
            ? "📌 "
            : "";

        const count =
          counts[topic.id] || 0;

        const deleteButton =
          isAdmin
            ? `
              <button
                class="delete-topic-button"
                onclick="deleteTopic(${topic.id}, event)"
              >
                管理人：トピック削除
              </button>
            `
            : "";

        return `
          <div class="topic-wrap">

            <a
              class="topic"
              href="topic.html?id=${topic.id}"
            >
              <div class="topic-title">
                ${pinned}${escapeHTML(topic.title)}
              </div>

              ${
                topic.description
                  ? `
                    <div class="topic-description">
                      ${escapeHTML(topic.description)}
                    </div>
                  `
                  : ""
              }

              <div class="topic-meta">

                ${
                  topic.category
                    ? escapeHTML(topic.category) + " ・ "
                    : ""
                }

                ${formatDate(topic.created_at)}

                ・

                <span class="comment-count">
                  コメント(${count}件)
                </span>

              </div>
            </a>

            ${deleteButton}

          </div>
        `;

      }).join("");
  }

  async function updateLoginState() {

    await checkAdmin();

    if (isAdmin) {
      loginPanel.classList.add("hidden");
      adminPanel.classList.remove("hidden");
    } else {
      loginPanel.classList.remove("hidden");
      adminPanel.classList.add("hidden");
    }

    await loadTopics();
  }

  document
    .getElementById("login-button")
    .addEventListener("click", async () => {

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const message =
        document.getElementById("login-message");

      message.textContent =
        "ログイン中...";

      const { error } =
        await client.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        message.textContent =
          "ログインできませんでした。";

        console.error(error);
        return;
      }

      message.textContent = "";

      await updateLoginState();
    });

  document
    .getElementById("logout-button")
    .addEventListener("click", async () => {

      await client.auth.signOut();

      await updateLoginState();
    });

  document
    .getElementById("create-topic-button")
    .addEventListener("click", async () => {

      const title =
        document
          .getElementById("topic-title")
          .value
          .trim();

      const category =
        document
          .getElementById("topic-category")
          .value
          .trim();

      const description =
        document
          .getElementById("topic-description")
          .value
          .trim();

      const message =
        document.getElementById("admin-message");

      if (!title) {
        message.textContent =
          "タイトルを入力してください。";
        return;
      }

      message.textContent =
        "作成しています...";

      const { error } =
        await client
          .from("topics")
          .insert({
            title,
            category: category || null,
            description: description || null
          });

      if (error) {
        message.textContent =
          "トピックを作成できませんでした。";

        console.error(error);
        return;
      }

      document.getElementById("topic-title").value = "";
      document.getElementById("topic-category").value = "";
      document.getElementById("topic-description").value = "";

      message.textContent =
        "トピックを作成しました！";

      await loadTopics();
    });

  async function deleteTopic(id, event) {

    event.preventDefault();
    event.stopPropagation();

    if (!isAdmin) {
      return;
    }

    const ok = confirm(
      "このトピックを削除しますか？\n中のコメントもすべて削除されます。"
    );

    if (!ok) {
      return;
    }

    const { error } =
      await client
        .from("topics")
        .delete()
        .eq("id", id);

    if (error) {
      alert("トピックを削除できませんでした。");
      console.error(error);
      return;
    }

    await loadTopics();
  }

  client.auth.onAuthStateChange(() => {
    updateLoginState();
  });

  updateLoginState();
</script>

</body>
</html>
